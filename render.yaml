# Render Blueprint — backend FastAPI (monorepo: solo despliega carpeta backend/)
services:
  - type: web
    name: barb-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildFilter:
      paths:
        - backend/**
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: .venv/bin/uvicorn barb.main:app --app-dir src --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false
      - key: LLM_PROVIDER
        value: nvidia
      - key: LLM_MODEL
        value: nvidia/nemotron-3.5-lightning-30b-a3b
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_TIMEOUT
        value: "180"
      - key: CORS_ORIGINS
        value: https://capstone-barb.pages.dev
      - key: CORS_ORIGIN_REGEX
        value: https://([a-z0-9-]+\.)?capstone-barb\.pages\.dev
      # Disco efimero en plan free: fotos de OT se pierden al redeploy/reposo.
      - key: UPLOAD_DIR
        value: /tmp/uploads
